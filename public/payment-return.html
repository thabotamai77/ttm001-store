<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Payment status — TTM.001</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="navbar"><a class="logo" href="/">TTM<span>.001</span></a><a class="button button-yellow" href="/">BACK TO STORE</a></header>
<main class="intro"><p class="eyebrow">ORDER / PAYMENT STATUS</p><h2 id="title">CHECKING YOUR PAYMENT…</h2><p id="message">Please wait while we verify the transaction with the payment provider. Do not rely on the browser redirect alone as proof of payment.</p></main>
<script>
(async()=>{const params=new URLSearchParams(location.search);const ref=params.get("reference")||params.get("trxref");const title=document.querySelector("#title"),msg=document.querySelector("#message");if(!ref){title.textContent="PAYMENT NOT CONFIRMED.";msg.textContent="No payment reference was returned. If money was deducted, contact the store with your proof of payment.";return;}try{const r=await fetch("/api/payment-status/"+encodeURIComponent(ref));const d=await r.json();if(r.ok&&d.status==="paid"){title.textContent="PAYMENT VERIFIED.";msg.textContent="Your payment has been confirmed by the payment provider. Keep your reference: "+ref+". The store will use your order email for follow-up.";}else{title.textContent="PAYMENT PENDING.";msg.textContent="We have not yet confirmed this payment. Do not pay a second time immediately. Save your reference "+ref+" and contact the store if the status does not update.";}}catch{title.textContent="STATUS UNAVAILABLE.";msg.textContent="We could not check the payment right now. Save your reference "+ref+" and check again shortly.";}})();
</script></body></html>
